<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勤務與任務系統</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #eceae3; --surface: #ffffff; --ink: #20201d; --ink-soft: #6f6e67;
    --line: #d6d4ca; --accent: #2f5d50; --accent-dark: #244a40;
    --accent-soft: #e3ede9; --mine: #fff6e3; --mine-line: #d9ad4e; --sel: #2f5d50;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  /* 登入 */
  #login-view {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    padding: 24px; text-align: center;
  }
  #login-view .mark {
    width: 52px; height: 52px; border-radius: 13px; background: var(--accent);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700;
  }
  #login-view .brand { font-size: 12px; letter-spacing: 3px; color: var(--ink-soft); }
  #login-view h1 { font-size: 26px; font-weight: 700; letter-spacing: 2px; }
  #login-view p { color: var(--ink-soft); font-size: 14px; }
  .btn-google {
    display: inline-flex; align-items: center; gap: 9px; background: var(--accent);
    color: #fff; border: none; padding: 13px 28px; border-radius: 9px;
    font-size: 15px; cursor: pointer; font-family: inherit;
  }
  .btn-google:hover { opacity: .9; }
  #login-hint { color: #8a3b2e; font-size: 13px; max-width: 320px; }
  /* 主畫面 */
  #app-view { display: none; height: 100vh; flex-direction: column; }
  header {
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 10px 18px; display: flex; align-items: center;
    justify-content: space-between; flex-wrap: wrap; gap: 10px; flex-shrink: 0;
  }
  header .title { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
  header .who { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
  header .who .tag {
    display: inline-block; background: var(--accent-soft); color: var(--accent);
    padding: 1px 7px; border-radius: 4px; margin-left: 5px; font-weight: 600;
  }
  .controls { display: flex; align-items: center; gap: 6px; }
  .controls button {
    font-family: inherit; font-size: 13px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); padding: 6px 11px;
    border-radius: 7px; cursor: pointer;
  }
  .controls button:hover { background: var(--bg); }
  .controls .month-label { font-weight: 700; min-width: 96px; text-align: center; }
  .btn-logout { color: var(--ink-soft); }
  /* 分頁切換 */
  #tabs {
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 0 14px; display: flex; gap: 4px; flex-shrink: 0;
  }
  .tab {
    border: none; background: none; font-family: inherit; font-size: 14px;
    padding: 11px 18px; cursor: pointer; color: var(--ink-soft);
    border-bottom: 3px solid transparent; font-weight: 600;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  /* 工具列 */
  .palette {
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 9px 18px; display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap; flex-shrink: 0;
  }
  .palette .hint { font-size: 12px; color: var(--ink-soft); margin-right: 4px; }
  .chip-btn {
    border: 1px solid var(--line); padding: 6px 14px; border-radius: 7px;
    font-size: 13px; font-family: inherit; cursor: pointer; font-weight: 600;
    transition: transform .08s;
  }
  .chip-btn:active { transform: scale(.94); }
  .mode-btn { background: var(--surface); }
  .mode-btn.on {
    background: #1d6fe0; color: #fff; border-color: #1d6fe0;
  }
  .palette .sel-count {
    margin-left: auto; font-size: 13px; font-weight: 700;
    padding: 4px 12px; border-radius: 999px;
    color: var(--ink-soft); background: transparent;
  }
  .palette .sel-count.active {
    color: #fff; background: #1d6fe0;
  }
  /* 表格 */
  .table-wrap { overflow: auto; flex: 1; padding: 14px; }
  table { border-collapse: separate; border-spacing: 0; background: var(--surface); }
  th, td {
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    text-align: center; font-size: 13px; white-space: nowrap;
  }
  thead th {
    background: var(--accent); color: #fff; padding: 7px 5px;
    position: sticky; top: 0; z-index: 10; font-weight: 600; border-right-color: #3a6d5e;
  }
  thead th.col-name { left: 0; z-index: 15; min-width: 72px; border-right-color: #3a6d5e; }
  th.weekend { background: var(--accent-dark); }
  tbody td.cell-name {
    position: sticky; left: 0; background: var(--surface); text-align: left;
    padding: 7px 8px; font-weight: 600; z-index: 5; min-width: 72px;
    font-size: 13px;
  }
  tbody td.cell-name .bno { display: none; }
  tbody tr.is-mine td.cell-name { background: var(--mine); border-left: 3px solid var(--mine-line); }
  /* 我的列：整列紅色底線，一眼認出是自己 */
  tbody tr.is-mine td { border-bottom: 2px solid #c0392b; }
  tbody tr.is-mine td.cell-name::after {
    content: "我"; position: absolute; right: 5px; top: 50%;
    transform: translateY(-50%);
    background: #c0392b; color: #fff; font-size: 10px;
    padding: 1px 5px; border-radius: 3px; font-weight: 700;
  }
  /* 今天的日期：藍色直線標示 */
  th.today, td.today-col {
    box-shadow: inset 2px 0 0 #1d6fe0, inset -2px 0 0 #1d6fe0;
  }
  thead th.today { background: #1d6fe0; }
  td.shift-cell {
    height: 38px; min-width: 44px; cursor: pointer;
    user-select: none; -webkit-user-select: none; position: relative; font-weight: 600;
    transition: box-shadow .1s, transform .1s;
  }
  /* 手機：格子縮小，畫面塞下更多日期 */
  @media (max-width: 600px) {
    thead th.col-name { min-width: 56px; }
    tbody td.cell-name { min-width: 56px; padding: 5px 5px; font-size: 12px; }
    td.shift-cell { min-width: 30px; height: 34px; font-size: 12px; }
    td.task-cell { min-width: 64px; height: 42px; }
    thead th { padding: 5px 2px; font-size: 11px; }
    .table-wrap { padding: 6px; }
  }
  td.shift-cell.readonly { cursor: default; color: var(--ink-soft); font-weight: 400; }
  /* 框選中：醒目高亮 —— 粗外框 + 內層藍綠罩 + 輕微放大 */
  td.shift-cell.selected, td.task-cell.selected {
    box-shadow: inset 0 0 0 3px #1d6fe0, 0 0 0 1px #1d6fe0;
    z-index: 4;
  }
  td.shift-cell.selected::before, td.task-cell.selected::before {
    content: ""; position: absolute; inset: 0;
    background: rgba(29,111,224,.22);
    pointer-events: none;
    animation: selPulse .18s ease-out;
  }
  td.shift-cell.selected::after {
    content: "✓"; position: absolute; top: 1px; right: 3px;
    font-size: 10px; color: #1d6fe0; font-weight: 700; pointer-events: none;
  }
  @keyframes selPulse {
    from { background: rgba(29,111,224,.5); }
    to   { background: rgba(29,111,224,.22); }
  }
  /* 任務格子 */
  td.task-cell {
    min-width: 96px; height: 46px; cursor: pointer; position: relative;
    padding: 3px 5px; vertical-align: middle;
    transition: box-shadow .1s;
  }
  td.task-cell.readonly { cursor: default; }
  td.task-cell .t-content {
    font-size: 11px; font-weight: 600; line-height: 1.25;
    white-space: normal; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  td.task-cell .t-status {
    font-size: 10px; padding: 0 5px; border-radius: 3px;
    display: inline-block; margin-top: 2px; font-weight: 600;
  }
  /* 未完成任務：紅框標示 */
  td.task-cell.unfinished {
    box-shadow: inset 0 0 0 2px #c0392b;
  }
  /* 狀態列 */
  #status-bar {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 9px 18px;
    border-radius: 999px; font-size: 13px; opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 50;
  }
  #status-bar.show { opacity: 1; }
  #status-bar.error { background: #8a3b2e; }
  .loading { padding: 50px; text-align: center; color: var(--ink-soft); }
  /* 任務編輯彈窗 */
  #task-modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
    z-index: 60; align-items: center; justify-content: center; padding: 20px;
  }
  #task-modal .box {
    background: var(--surface); border-radius: 12px; padding: 20px;
    width: 100%; max-width: 380px;
  }
  #task-modal h3 { font-size: 16px; margin-bottom: 4px; }
  #task-modal .sub { font-size: 12px; color: var(--ink-soft); margin-bottom: 14px; }
  #task-modal label { font-size: 12px; color: var(--ink-soft); display: block; margin-bottom: 4px; }
  #task-modal textarea {
    width: 100%; font-family: inherit; font-size: 14px; padding: 8px;
    border: 1px solid var(--line); border-radius: 7px; resize: vertical;
    min-height: 64px; margin-bottom: 12px;
  }
  #task-modal .status-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  #task-modal .status-opt {
    border: 1px solid var(--line); padding: 6px 12px; border-radius: 7px;
    font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 600;
  }
  #task-modal .status-opt.picked { outline: 2px solid var(--accent); }
  #task-modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  #task-modal .modal-actions button {
    font-family: inherit; font-size: 14px; padding: 8px 16px;
    border-radius: 7px; cursor: pointer; border: 1px solid var(--line);
    background: var(--surface);
  }
  #task-modal .modal-actions .primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  /* 班別設定列表 */
  .ss-row {
    display: flex; align-items: center; gap: 6px; padding: 6px 0;
    border-bottom: 1px solid var(--line);
  }
  .ss-row input[type=text] {
    font-family: inherit; font-size: 13px; padding: 5px 8px;
    border: 1px solid var(--line); border-radius: 6px;
  }
  .ss-row input.ss-code { width: 64px; }
  .ss-row input.ss-label { flex: 1; min-width: 80px; }
  .ss-row input[type=color] {
    width: 36px; height: 30px; border: 1px solid var(--line);
    border-radius: 6px; background: none; cursor: pointer;
  }
  .ss-row input[type=number] {
    width: 50px; font-family: inherit; font-size: 13px;
    padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px;
  }
  .ss-row .ss-toggle {
    font-family: inherit; font-size: 12px; padding: 5px 9px;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); cursor: pointer;
  }
  .ss-row.inactive { opacity: .5; }

  /* 人員排序列表 */
  .ro-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .ro-row .ro-order {
    width: 70px; font-family: inherit; font-size: 14px; font-weight: 600;
    padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px;
    text-align: center;
  }
  .ro-row .ro-name { flex: 1; font-size: 14px; font-weight: 600; }
  .ro-row .ro-badge {
    font-size: 11px; color: var(--ink-soft);
    background: var(--bg); padding: 2px 6px; border-radius: 4px;
  }

  /* 我的面板 */
  .mine-section { max-width: 720px; margin: 0 auto; }
  .mine-section h2 {
    font-size: 14px; color: var(--ink-soft); letter-spacing: 1px;
    font-weight: 600; margin: 16px 0 8px; text-transform: uppercase;
  }
  .mine-section h2:first-child { margin-top: 0; }
  .mine-empty {
    background: var(--surface); border: 1px dashed var(--line);
    border-radius: 10px; padding: 24px; text-align: center;
    color: var(--ink-soft); font-size: 13px;
  }
  .mine-task {
    background: var(--surface); border-radius: 10px; padding: 12px 14px;
    margin-bottom: 8px; display: flex; align-items: flex-start; gap: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
    border-left: 3px solid #c0392b;
  }
  .mine-task.done { border-left-color: #6f9c5b; opacity: .6; }
  .mine-task .t-main { flex: 1; min-width: 0; }
  .mine-task .t-date {
    font-size: 11px; color: var(--ink-soft); font-weight: 600;
    margin-bottom: 3px;
  }
  .mine-task .t-text {
    font-size: 14px; font-weight: 600; line-height: 1.4;
    word-break: break-word;
  }
  .mine-task .t-status-tag {
    font-size: 11px; padding: 3px 8px; border-radius: 999px;
    font-weight: 600; white-space: nowrap;
  }
  .mine-task .t-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .mine-task .t-act-btn {
    font-family: inherit; font-size: 12px; padding: 4px 10px;
    border-radius: 6px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer;
  }

  /* 多筆任務清單面板（取代原本的單筆任務彈窗） */
  .tasklist-row {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .tasklist-row:last-child { border-bottom: none; }
  .tasklist-row .tl-content {
    flex: 1; font-size: 13px; word-break: break-word;
    line-height: 1.4;
  }
  .tasklist-row .tl-status {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    font-weight: 600; white-space: nowrap; cursor: pointer;
  }
  .tasklist-row.done { opacity: .55; }
  .tasklist-row.done .tl-content { text-decoration: line-through; }
  .tasklist-empty {
    padding: 16px; text-align: center; color: var(--ink-soft);
    font-size: 13px;
  }

  /* 批次指派彈窗的日期區間區 */
  .date-range-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .date-range-row input[type=date] {
    font-family: inherit; font-size: 14px; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 7px;
  }
  .date-range-row label { font-size: 12px; color: var(--ink-soft); margin: 0; }
</style>
</head>
<body>

<!-- 登入 -->
<div id="login-view">
  <div class="mark">勤</div>
  <div class="brand">SPFH · 勤務與任務系統</div>
  <h1>勤務與任務系統</h1>
  <p>請使用您的 Google 帳號登入</p>
  <button class="btn-google" id="btn-login">使用 Google 登入</button>
  <p id="login-hint"></p>
</div>

<!-- 主畫面 -->
<div id="app-view">
  <header>
    <div>
      <div class="title">勤務與任務系統</div>
      <div class="who" id="who"></div>
    </div>
    <div class="controls">
      <button id="prev-month">‹</button>
      <span class="month-label" id="month-label"></span>
      <button id="next-month">›</button>
      <button id="refresh">重新整理</button>
      <button class="btn-logout" id="btn-logout">登出</button>
    </div>
  </header>

  <div id="tabs">
    <button class="tab active" data-tab="mine">我的面板</button>
    <button class="tab" data-tab="shift">勤務預定表</button>
    <button class="tab" data-tab="task">任務安排表</button>
  </div>

  <!-- 勤務分頁的班別工具列 -->
  <div class="palette" id="shift-palette">
    <button class="chip-btn mode-btn" id="shift-select-mode">批次選取</button>
    <button class="chip-btn mode-btn" id="shift-show-time">⏱ 修改時間</button>
    <span class="hint" id="shift-hint">點格子可直接設定班別</span>
    <span id="shift-buttons"></span>
    <button class="chip-btn" id="shift-settings-btn" style="display:none">⚙ 班別設定</button>
    <button class="chip-btn" id="roster-order-btn" style="display:none">⚙ 人員排序</button>
    <span class="sel-count" id="sel-count"></span>
  </div>

  <!-- 任務分頁的說明列 -->
  <div class="palette" id="task-palette" style="display:none">
    <button class="chip-btn mode-btn" id="task-select-mode" style="display:none">批次選取</button>
    <span class="hint" id="task-hint">點任一格新增或編輯任務</span>
    <button class="chip-btn" id="task-assign-btn" style="display:none;background:var(--accent);color:#fff">指派任務給已選格子</button>
    <span class="sel-count" id="task-sel-count"></span>
  </div>

  <div class="table-wrap" id="table-wrap" style="display:none">
    <div class="loading">載入中…</div>
  </div>

  <!-- 我的面板 -->
  <div id="mine-view" style="flex:1;overflow:auto;padding:16px;background:var(--bg);">
    <div class="loading">載入中…</div>
  </div>
</div>

<!-- A. 多筆任務清單面板（點格子開這個） -->
<div id="task-list-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;align-items:center;justify-content:center;padding:20px;">
  <div style="background:var(--surface);border-radius:12px;padding:18px;width:100%;max-width:480px;max-height:80vh;display:flex;flex-direction:column;">
    <h3 id="tlm-title" style="font-size:16px;margin-bottom:4px;">任務清單</h3>
    <div id="tlm-sub" style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;"></div>

    <div id="tlm-list" style="flex:1;overflow:auto;margin-bottom:12px;"></div>

    <div id="tlm-add-area">
      <label style="font-size:12px;color:var(--ink-soft);">新增任務</label>
      <textarea id="tlm-new-content" placeholder="輸入任務內容…" style="width:100%;font-family:inherit;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:7px;resize:vertical;min-height:54px;margin-bottom:8px;"></textarea>
    </div>

    <div class="modal-actions" style="display:flex;gap:8px;justify-content:space-between;">
      <button id="tlm-add-btn" class="primary" style="font-family:inherit;font-size:14px;padding:8px 16px;border-radius:7px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;">新增此任務</button>
      <button id="tlm-close" style="font-family:inherit;font-size:14px;padding:8px 16px;border-radius:7px;cursor:pointer;border:1px solid var(--line);background:var(--surface);">關閉</button>
    </div>
  </div>
</div>

<!-- B. 批次指派彈窗（管理者用） -->
<div id="batch-assign-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;align-items:center;justify-content:center;padding:20px;">
  <div style="background:var(--surface);border-radius:12px;padding:18px;width:100%;max-width:440px;">
    <h3 style="font-size:16px;margin-bottom:4px;">批次指派任務</h3>
    <div id="bam-sub" style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;"></div>

    <label style="font-size:12px;color:var(--ink-soft);">日期範圍</label>
    <div class="date-range-row">
      <input type="date" id="bam-from">
      <label>至</label>
      <input type="date" id="bam-to">
    </div>

    <label style="font-size:12px;color:var(--ink-soft);">指派對象</label>
    <div style="margin-bottom:12px;display:flex;gap:8px;align-items:center;">
      <span id="bam-target-info" style="font-size:13px;flex:1;">（用已選的格子人員）</span>
      <button id="bam-all-btn" class="chip-btn" style="background:var(--accent);color:#fff;border-color:var(--accent);">指派給全部人</button>
    </div>

    <label style="font-size:12px;color:var(--ink-soft);">任務內容</label>
    <textarea id="bam-content" placeholder="輸入任務內容…" style="width:100%;font-family:inherit;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:7px;resize:vertical;min-height:64px;margin-bottom:14px;"></textarea>

    <div class="modal-actions" style="display:flex;gap:8px;justify-content:flex-end;">
      <button id="bam-cancel" style="font-family:inherit;font-size:14px;padding:8px 16px;border-radius:7px;cursor:pointer;border:1px solid var(--line);background:var(--surface);">取消</button>
      <button id="bam-save" class="primary" style="font-family:inherit;font-size:14px;padding:8px 16px;border-radius:7px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;">指派</button>
    </div>
  </div>
</div>

<!-- 班別設定彈窗（僅管理者） -->
<div id="shift-settings-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;align-items:center;justify-content:center;padding:20px;">

      <input id="ss-new-color" type="color" value="#e6e3d4" style="width:42px;height:34px;border:1px solid var(--line);border-radius:7px;background:none;cursor:pointer;">
      <button class="chip-btn" id="ss-add-btn" style="background:var(--accent);color:#fff;border-color:var(--accent);">新增</button>
    </div>
    <div class="modal-actions" style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;">
      <button id="ss-close" style="font-family:inherit;font-size:14px;padding:8px 16px;border-radius:7px;cursor:pointer;border:1px solid var(--line);background:var(--surface);">關閉</button>

<div id="status-bar"></div>

<script>
/* =================== 設定 =================== */
const SUPABASE_URL = "https://rpwuhzrwekziwhemfszj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_a5AZ3zUsrdrrhEer8YTsFA_RU6s4A8x";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =================== 狀態 =================== */
let me = null, roster = [];
let shiftTypes = [], shiftMap = {};
let taskStatuses = [], taskStatusMap = {};
let viewYear, viewMonth;
let currentTab = "mine";  // 預設停在「我的面板」
let shiftLatest = {};          // 勤務：key -> value
let shiftLatestTime = {};      // 勤務：key -> 最後修改時間 ISO 字串
let showShiftTime = false;     // 是否顯示修改時間
let tasksByCell = {};          // 任務：key (entity|date) -> [{id, content, status, ...}]
let myOpenTasks = [];          // 我的面板用：我所有未完成的任務
let selectedCells = new Set(); // 勤務框選
let shiftRectAnchor = null;
let tlmContext = null;         // 任務清單面板 context: {entityId, date, taskList}

/* =================== 工具 =================== */
function showStatus(msg, isErr) {
  const b = document.getElementById("status-bar");
  b.textContent = msg; b.className = "show" + (isErr ? " error" : "");
  clearTimeout(b._t); b._t = setTimeout(() => { b.className = ""; }, 2600);
}
function pad(n){ return String(n).padStart(2,"0"); }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function dateStr(y,m,d){ return `${y}-${pad(m)}-${pad(d)}`; }
function textColorFor(hex){
  const h = hex.replace("#","");
  if (h.length < 6) return "#20201d";
  const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  return (r*299+g*587+b*114)/1000 > 150 ? "#20201d" : "#ffffff";
}

/* =================== 登入 =================== */
document.getElementById("btn-login").onclick = async () => {
  const { error } = await sb.auth.signInWithOAuth({
    provider: "google", options: { redirectTo: window.location.href }
  });
  if (error) document.getElementById("login-hint").textContent = "登入失敗：" + error.message;
};
document.getElementById("btn-logout").onclick = async () => {
  await sb.auth.signOut(); location.reload();
};

(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (session) await enterApp(session);
  sb.auth.onAuthStateChange(async (_e, session) => {
    if (session && document.getElementById("app-view").style.display !== "flex") {
      await enterApp(session);
    }
  });
})();

/* =================== 進入主畫面 =================== */
async function enterApp(session){
  const email = session.user.email;
  const { data, error } = await sb.from("roster")
    .select("id, badge_no, name, email, role").eq("email", email).maybeSingle();
  if (error) {
    document.getElementById("login-hint").textContent = "讀取人員資料失敗：" + error.message;
    return;
  }
  if (!data) {
    document.getElementById("login-hint").textContent =
      "您的帳號（" + email + "）不在名單中，請聯絡管理者。";
    await sb.auth.signOut();
    return;
  }
  me = data;
  document.getElementById("login-view").style.display = "none";
  document.getElementById("app-view").style.display = "flex";
  document.getElementById("who").innerHTML =
    me.name + "（" + me.badge_no + "）<span class='tag'>" +
    (me.role === "admin" ? "管理者" : "一般人員") + "</span>";

  // 班別
  const st = await sb.from("shift_type").select("code,label,color,sort_order")
    .eq("active", true).order("sort_order");
  shiftTypes = st.data || [];
  shiftMap = {}; shiftTypes.forEach(s => shiftMap[s.code] = s);
  renderShiftPalette();

  // 任務狀態
  const ts = await sb.from("task_status").select("code,label,color,sort_order")
    .eq("active", true).order("sort_order");
  taskStatuses = ts.data || [];
  taskStatusMap = {}; taskStatuses.forEach(s => taskStatusMap[s.code] = s);

  // 人員(依 display_order 排序,沒設則用 badge_no)
  const r = await sb.from("roster").select("id,badge_no,name,display_order")
    .eq("active", true)
    .order("display_order", { ascending: true, nullsFirst: false })
    .order("badge_no");
  roster = r.data || [];

  const now = new Date();
  viewYear = now.getFullYear(); viewMonth = now.getMonth() + 1;

  // 管理者才能看到「班別設定」「人員排序」按鈕
  if (me.role === "admin") {
    document.getElementById("shift-settings-btn").style.display = "inline-block";
    document.getElementById("roster-order-btn").style.display = "inline-block";
  }

  await loadMonth();
  // 預設停留在「我的面板」
  switchTab("mine");
}

/* =================== 批次選取模式 =================== */
let shiftSelectMode = false;
let taskSelectMode = false;

/* =================== 分頁切換 =================== */
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    switchTab(t.dataset.tab);
  };
});

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(x => {
    x.classList.toggle("active", x.dataset.tab === tab);
  });

  // 顯示對應主區
  document.getElementById("table-wrap").style.display =
    (tab === "shift" || tab === "task") ? "block" : "none";
  document.getElementById("mine-view").style.display =
    tab === "mine" ? "block" : "none";

  // 工具列
  document.getElementById("shift-palette").style.display =
    tab === "shift" ? "flex" : "none";
  document.getElementById("task-palette").style.display =
    tab === "task" ? "flex" : "none";

  if (tab === "task") {
    document.getElementById("task-select-mode").style.display = "inline-block";
    document.getElementById("task-assign-btn").style.display = "none";
  }

  setShiftSelectMode(false);
  setTaskSelectMode(false);
  clearSelection();
  clearTaskSelection();
  updateSelCount();
  updateTaskSelCount();

  if (tab === "mine") {
    renderMyPanel();
  } else {
    renderTable();
  }
}

/* =================== 班別工具列 =================== */
function renderShiftPalette(){
  const box = document.getElementById("shift-buttons");
  box.innerHTML = "";
  for (const s of shiftTypes) {
    const btn = document.createElement("button");
    btn.className = "chip-btn"; btn.textContent = s.label;
    btn.style.background = s.color; btn.style.color = textColorFor(s.color);
    btn.onclick = () => applyShiftToSelection(s.code);
    box.appendChild(btn);
  }
}

/* =================== 載入當月（兩個分頁的資料一起載） =================== */
async function loadMonth(){
  document.getElementById("month-label").textContent = viewYear + " 年 " + viewMonth + " 月";
  const wrap = document.getElementById("table-wrap");
  wrap.innerHTML = "<div class='loading'>載入中…</div>";
  selectedCells.clear(); updateSelCount();

  const nDays = daysInMonth(viewYear, viewMonth);
  const first = dateStr(viewYear, viewMonth, 1);
  const last = dateStr(viewYear, viewMonth, nDays);

  // 勤務（順帶記每格最後修改時間）
  const sres = await sb.from("shift_log")
    .select("entity_id,work_date,value,created_at")
    .gte("work_date", first).lte("work_date", last)
    .order("created_at", { ascending: true });
  shiftLatest = {};
  shiftLatestTime = {};
  if (!sres.error) for (const row of sres.data) {
    const k = row.entity_id + "|" + row.work_date;
    shiftLatest[k] = row.value;
    shiftLatestTime[k] = row.created_at;  // 因為按時間升冪,最後一筆就是最新
  }

  // 任務（新表：每筆任務一列；過濾掉已撤銷）
  const tres = await sb.from("task")
    .select("id,entity_id,work_date,content,status,created_at")
    .gte("work_date", first).lte("work_date", last)
    .neq("status", "已撤銷")
    .order("created_at", { ascending: true });
  tasksByCell = {};
  if (!tres.error) for (const row of tres.data) {
    const k = row.entity_id + "|" + row.work_date;
    if (!tasksByCell[k]) tasksByCell[k] = [];
    tasksByCell[k].push(row);
  }

  if (sres.error) {
    wrap.innerHTML = "<div class='loading'>勤務資料載入失敗：" + sres.error.message + "</div>";
    return;
  }
  if (currentTab === "mine") renderMyPanel();
  else renderTable();
}

/* =================== 繪製表格（依目前分頁） =================== */
function renderTable(){
  const wrap = document.getElementById("table-wrap");
  const nDays = daysInMonth(viewYear, viewMonth);
  const weekNames = ["日","一","二","三","四","五","六"];

  // 今天（只有檢視的年月正好是這個月，才標示）
  const today = new Date();
  const todayStr = (today.getFullYear() === viewYear && today.getMonth() + 1 === viewMonth)
    ? dateStr(viewYear, viewMonth, today.getDate()) : null;

  let html = "<table><thead><tr><th class='col-name'>姓名</th>";
  for (let d = 1; d <= nDays; d++) {
    const ds = dateStr(viewYear, viewMonth, d);
    const wd = new Date(viewYear, viewMonth - 1, d).getDay();
    let cls = (wd === 0 || wd === 6) ? "weekend" : "";
    if (ds === todayStr) cls += " today";
    html += "<th class='" + cls.trim() + "'>" + d +
            "<br><span style='font-weight:400;font-size:11px'>" + weekNames[wd] + "</span></th>";
  }
  html += "</tr></thead><tbody>";

  for (const person of roster) {
    const isMine = person.id === me.id;
    const canEdit = isMine || me.role === "admin";
    html += "<tr class='" + (isMine ? "is-mine" : "") +
            "' data-rowentity='" + person.id + "'>";
    html += "<td class='cell-name'>" + person.name + "</td>";
    for (let d = 1; d <= nDays; d++) {
      const ds = dateStr(viewYear, viewMonth, d);
      const isToday = (ds === todayStr);
      html += (currentTab === "shift")
        ? shiftCellHtml(person.id, ds, canEdit, isToday)
        : taskCellHtml(person.id, ds, canEdit, isToday);
    }
    html += "</tr>";
  }
  html += "</tbody></table>";
  wrap.innerHTML = html;

  if (currentTab === "shift") bindShiftEvents();
  else bindTaskEvents();

  // 開啟時自動捲到「我的列 × 今天那欄」
  scrollToMyRow();
  scrollToTodayColumn();
}

/* 捲動定位到使用者自己那一列（直向） */
function scrollToMyRow(){
  const myRow = document.querySelector("tr.is-mine");
  if (myRow) {
    myRow.scrollIntoView({ block: "center", behavior: "auto" });
  }
}

/* 捲動定位到今天那欄（橫向：把今天放在畫面偏左中） */
function scrollToTodayColumn(){
  const wrap = document.getElementById("table-wrap");
  const todayCell = document.querySelector("td.today-col");
  if (!wrap || !todayCell) return;
  // 計算今天那欄在表格容器內的位置
  const cellLeft = todayCell.offsetLeft;
  // 姓名欄是 sticky 黏在左邊；扣掉它的寬度後，把今天放到容器內 1/4 處
  const nameCol = document.querySelector("td.cell-name");
  const nameW = nameCol ? nameCol.offsetWidth : 80;
  const target = cellLeft - nameW - Math.floor(wrap.clientWidth * 0.25);
  wrap.scrollLeft = Math.max(0, target);
}

/* ---------- 勤務格子 ---------- */
function shiftCellHtml(entityId, ds, canEdit, isToday){
  const k = entityId + "|" + ds;
  const val = shiftLatest[k] || "未排";
  const st = shiftMap[val];
  const bg = st ? st.color : "#ffffff";
  const label = (val === "未排") ? "" : (st ? st.label.replace(/班$/,"") : val);

  // 內容：開啟「修改時間」模式時 → 用時間取代班別文字（背景色保留）
  //                關閉時 → 顯示班別文字
  let inner = label;
  if (showShiftTime && shiftLatestTime[k]) {
    inner = "<div style='font-size:10px;font-weight:600;line-height:1.15;'>" +
            formatShortDate(shiftLatestTime[k]) + "<br>" +
            formatShortClock(shiftLatestTime[k]) + "</div>";
  }
  return "<td class='shift-cell" + (canEdit ? "" : " readonly") +
         (isToday ? " today-col" : "") +
         "' data-entity='" + entityId + "' data-date='" + ds +
         "' data-edit='" + (canEdit ? 1 : 0) + "' style='background:" + bg +
         ";color:" + textColorFor(bg) + "'>" + inner + "</td>";
}

/* 格式化時間：拆成日期 5/20 與時間 16:30 兩部分 */
function formatShortDate(iso){
  const d = new Date(iso);
  return (d.getMonth() + 1) + "/" + d.getDate();
}
function formatShortClock(iso){
  const d = new Date(iso);
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

/* ---------- 任務格子（顯示多筆摘要） ---------- */
function taskCellHtml(entityId, ds, canEdit, isToday){
  const tasks = tasksByCell[entityId + "|" + ds] || [];
  let inner = "";
  let bg = "#ffffff";
  let unfinished = false;
  if (tasks.length > 0) {
    bg = "#fbfbf8";
    const total = tasks.length;
    const open = tasks.filter(t => t.status !== "完成").length;
    unfinished = open > 0;
    inner = "<div class='t-content' style='font-size:11px;line-height:1.3;'>" +
            total + " 筆" + (open > 0 ? "<br><span style='color:#c0392b'>未完 " + open + "</span>" : "<br><span style='color:#6f9c5b'>全完成</span>") +
            "</div>";
  }
  return "<td class='task-cell" + (canEdit ? "" : " readonly") +
         (unfinished ? " unfinished" : "") +
         (isToday ? " today-col" : "") +
         "' data-entity='" + entityId + "' data-date='" + ds +
         "' data-edit='" + (canEdit ? 1 : 0) + "' style='background:" + bg + "'>" +
         inner + "</td>";
}
function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}

/* =================== 矩形範圍計算（起點×終點 → 中間整片格子）=================== */
/* 回傳 [{entity, date}, ...]，涵蓋兩格之間的「人 × 日期」矩形 */
function rectRange(a, b){
  // 人員：用 roster 的順序定出範圍
  const iA = roster.findIndex(p => p.id === a.entity);
  const iB = roster.findIndex(p => p.id === b.entity);
  if (iA < 0 || iB < 0) return [];
  const loP = Math.min(iA, iB), hiP = Math.max(iA, iB);
  // 日期：字串比較即可（YYYY-MM-DD）
  const loD = a.date < b.date ? a.date : b.date;
  const hiD = a.date < b.date ? b.date : a.date;
  const cells = [];
  for (let i = loP; i <= hiP; i++) {
    const pid = roster[i].id;
    for (let d = 1; d <= daysInMonth(viewYear, viewMonth); d++) {
      const ds = dateStr(viewYear, viewMonth, d);
      if (ds >= loD && ds <= hiD) cells.push({ entity: pid, date: ds });
    }
  }
  return cells;
}

/* =================== 勤務：批次選取模式互動 =================== */
function bindShiftEvents(){
  const wrap = document.getElementById("table-wrap");
  wrap.querySelectorAll("td.shift-cell").forEach(td => {
    if (td.dataset.edit !== "1") return;
    td.onclick = () => onShiftCellClick(td);
  });
}

function onShiftCellClick(td){
  if (shiftSelectMode) {
    const cell = { entity: td.dataset.entity, date: td.dataset.date };
    if (!shiftRectAnchor) {
      // 第一次點 = 起點
      clearSelection();
      shiftRectAnchor = cell;
      toggleCell(td, true);
      updateSelCount();
      showStatus("已選起點，再點另一格框出範圍");
    } else {
      // 第二次點 = 終點，框出矩形
      const cells = rectRange(shiftRectAnchor, cell);
      clearSelection();
      for (const c of cells) {
        const el = document.querySelector(
          "td.shift-cell[data-entity='" + c.entity + "'][data-date='" + c.date + "']");
        if (el && el.dataset.edit === "1") toggleCell(el, true);
      }
      shiftRectAnchor = null;
      updateSelCount();
    }
  } else {
    // 一般模式：點一格 = 直接選這一格（再點班別套用）
    clearSelection();
    toggleCell(td, true);
    updateSelCount();
  }
}

/* 切換批次選取模式 */
function setShiftSelectMode(on){
  shiftSelectMode = on;
  const btn = document.getElementById("shift-select-mode");
  const hint = document.getElementById("shift-hint");
  if (on) {
    btn.classList.add("on");
    btn.textContent = "選取中（點完成後選班別）";
    hint.textContent = me.role === "admin"
      ? "點一格當起點，再點另一格，框出中間整片範圍（可跨人員）。"
      : "點一格當起點，再點同列另一格，框出整段。";
  } else {
    btn.classList.remove("on");
    btn.textContent = "批次選取";
    hint.textContent = "點格子可直接設定班別";
    clearSelection();
    updateSelCount();
  }
}
document.getElementById("shift-select-mode").onclick = () => {
  setShiftSelectMode(!shiftSelectMode);
};

/* 顯示修改時間切換 */
document.getElementById("shift-show-time").onclick = () => {
  showShiftTime = !showShiftTime;
  const btn = document.getElementById("shift-show-time");
  btn.classList.toggle("on", showShiftTime);
  btn.textContent = showShiftTime ? "⏱ 隱藏時間" : "⏱ 修改時間";
  if (currentTab === "shift") renderTable();
};

function toggleCell(td, on){
  const key = td.dataset.entity + "|" + td.dataset.date;
  if (on) { selectedCells.add(key); td.classList.add("selected"); }
  else { selectedCells.delete(key); td.classList.remove("selected"); }
}
function clearSelection(){
  selectedCells.clear();
  shiftRectAnchor = null;
  document.querySelectorAll("td.shift-cell.selected").forEach(td => td.classList.remove("selected"));
}
function updateSelCount(){
  const n = selectedCells.size;
  const el = document.getElementById("sel-count");
  el.textContent = n > 0 ? "已選 " + n + " 格 — 點上方班別套用" : "";
  el.className = "sel-count" + (n > 0 ? " active" : "");
}

async function applyShiftToSelection(code){
  if (selectedCells.size === 0) { showStatus("請先框選要設定的格子", true); return; }
  const rows = [];
  for (const key of selectedCells) {
    const [entity_id, work_date] = key.split("|");
    rows.push({ entity_id, work_date, value: code, created_by: me.email });
  }
  const { error } = await sb.from("shift_log").insert(rows);
  if (error) { showStatus("儲存失敗：" + error.message, true); return; }
  const nowIso = new Date().toISOString();
  const keys = Array.from(selectedCells);
  for (const key of keys) {
    shiftLatest[key] = code;
    shiftLatestTime[key] = nowIso;  // 剛剛寫入,時間就是現在
    const [eid, ds] = key.split("|");
    const td = document.querySelector(
      "td.shift-cell[data-entity='" + eid + "'][data-date='" + ds + "']");
    if (td) {
      const st = shiftMap[code];
      td.style.background = st.color; td.style.color = textColorFor(st.color);
      const label = (code === "未排") ? "" : st.label.replace(/班$/,"");
      // 開啟時間模式 → 顯示時間取代班別文字;關閉 → 顯示班別文字
      if (showShiftTime) {
        td.innerHTML = "<div style='font-size:10px;font-weight:600;line-height:1.15;'>" +
                       formatShortDate(nowIso) + "<br>" +
                       formatShortClock(nowIso) + "</div>";
      } else {
        td.innerHTML = label;
      }
    }
  }
  clearSelection(); updateSelCount();
  if (shiftSelectMode) setShiftSelectMode(false);
  showStatus("已儲存 " + keys.length + " 格");
}

/* =================== 任務：互動 =================== */
let taskSelected = new Set();
let taskRectAnchor = null;  // 任務矩形框選起點

function clearTaskSelection(){
  taskSelected.clear();
  taskRectAnchor = null;
  document.querySelectorAll("td.task-cell.selected").forEach(td => td.classList.remove("selected"));
}
function updateTaskSelCount(){
  const n = taskSelected.size;
  const el = document.getElementById("task-sel-count");
  el.textContent = n > 0 ? "已選 " + n + " 格 — 點「指派任務」按鈕" : "";
  el.className = "sel-count" + (n > 0 ? " active" : "");
}
function toggleTaskCell(td, on){
  const key = td.dataset.entity + "|" + td.dataset.date;
  if (on) { taskSelected.add(key); td.classList.add("selected"); }
  else { taskSelected.delete(key); td.classList.remove("selected"); }
}

function bindTaskEvents(){
  const wrap = document.getElementById("table-wrap");
  wrap.querySelectorAll("td.task-cell").forEach(td => {
    if (td.dataset.edit !== "1") return;
    td.onclick = () => onTaskCellClick(td);
  });
}

/* ============ 任務格子點擊（多筆版） ============ */
function onTaskCellClick(td){
  if (taskSelectMode) {
    // 批次選取模式：矩形框選
    const cell = { entity: td.dataset.entity, date: td.dataset.date };
    if (!taskRectAnchor) {
      clearTaskSelection();
      taskRectAnchor = cell;
      toggleTaskCell(td, true);
      updateTaskSelCount();
      showStatus("已選起點，再點另一格框出範圍");
    } else {
      const cells = rectRange(taskRectAnchor, cell);
      clearTaskSelection();
      for (const c of cells) {
        const el = document.querySelector(
          "td.task-cell[data-entity='" + c.entity + "'][data-date='" + c.date + "']");
        if (el && el.dataset.edit === "1") toggleTaskCell(el, true);
      }
      taskRectAnchor = null;
      updateTaskSelCount();
    }
  } else {
    // 一般模式：開啟「這格的任務清單」
    openTaskListModal(td.dataset.entity, td.dataset.date);
  }
}

/* 切換任務批次選取模式（僅 admin） */

/* ============ A. 任務清單面板（點格子開啟） ============ */
async function openTaskListModal(entityId, date){
  const person = roster.find(p => p.id === entityId);
  const isAdmin = me.role === "admin";
  const isMine = entityId === me.id;
  const canEdit = isMine || isAdmin;

  document.getElementById("tlm-title").textContent =
    "任務清單 — " + (person ? person.name : "");
  document.getElementById("tlm-sub").textContent = date;

  // 重新從資料庫拉這格的任務（過濾已撤銷）
  const { data, error } = await sb.from("task")
    .select("id,content,status,created_at,created_by")
    .eq("entity_id", entityId).eq("work_date", date)
    .neq("status", "已撤銷")
    .order("created_at", { ascending: true });
  if (error) { showStatus("讀取失敗：" + error.message, true); return; }

  tlmContext = { entityId, date, tasks: data || [], canEdit, isAdmin };
  renderTaskList();

  // 新增區只給可編輯者看到
  document.getElementById("tlm-add-area").style.display = canEdit ? "block" : "none";
  document.getElementById("tlm-add-btn").style.display = canEdit ? "inline-block" : "none";

  document.getElementById("task-list-modal").style.display = "flex";
}

function renderTaskList(){
  if (!tlmContext) return;
  const box = document.getElementById("tlm-list");
  box.innerHTML = "";
  if (tlmContext.tasks.length === 0) {
    box.innerHTML = "<div class='tasklist-empty'>還沒有任務</div>";
    return;
  }
  const isAdmin = me.role === "admin";
  for (const t of tlmContext.tasks) {
    const stt = taskStatusMap[t.status];
    const stColor = stt ? stt.color : "#e6e3d4";
    const div = document.createElement("div");
    div.className = "tasklist-row" + (t.status === "完成" ? " done" : "");
    div.innerHTML = `
      <div class="tl-content">${escapeHtml(t.content)}</div>
      <span class="tl-status" style="background:${stColor};color:${textColorFor(stColor)}">
        ${stt ? stt.label : t.status}
      </span>
      ${isAdmin ? '<button class="tl-del" title="刪除此任務" style="font-family:inherit;font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:#c0392b;cursor:pointer;">✕</button>' : ''}
    `;
    div.querySelector(".tl-status").onclick = () => cycleTaskStatus(t);
    if (isAdmin) {
      div.querySelector(".tl-del").onclick = () => deleteTask(t);
    }
    box.appendChild(div);
  }
}

/* 管理者刪除任務（實際是改狀態為「已撤銷」） */
async function deleteTask(task){
  if (!confirm("確定刪除這筆任務？\n\n" + task.content + "\n\n（資料庫紀錄仍會保留，但畫面上會移除。）")) return;

  const { error } = await sb.from("task")
    .update({ status: "已撤銷", updated_at: new Date().toISOString(), updated_by: me.email })
    .eq("id", task.id);
  if (error) { showStatus("刪除失敗：" + error.message, true); return; }
  await sb.from("task_log").insert({
    task_id: task.id, field: "status", value: "已撤銷", created_by: me.email
  });

  // 從本地清單移除
  if (tlmContext) {
    tlmContext.tasks = tlmContext.tasks.filter(x => x.id !== task.id);
    renderTaskList();
  }
  const k = task.entity_id ? (task.entity_id + "|" + task.work_date)
                            : (tlmContext.entityId + "|" + tlmContext.date);
  if (tasksByCell[k]) {
    tasksByCell[k] = tasksByCell[k].filter(x => x.id !== task.id);
  }
  if (currentTab === "task" && tlmContext) {
    repaintTaskCell(tlmContext.entityId, tlmContext.date);
  }
  showStatus("已刪除");
}

/* 點狀態標籤 = 循環切換狀態（待辦 → 進行中 → 完成 → 待辦；不含「已撤銷」） */
async function cycleTaskStatus(task){
  if (!tlmContext || !tlmContext.canEdit) {
    showStatus("無權限修改", true); return;
  }
  // 找下一個狀態（排除「已撤銷」——它是刪除用，不在循環裡）
  const codes = taskStatuses.map(s => s.code).filter(c => c !== "已撤銷");
  const idx = codes.indexOf(task.status);
  const next = codes[(idx + 1) % codes.length];

  // 改為「完成」要打字確認
  if (next === "完成") {
    const typed = prompt("改為「完成」請輸入「完成」二字確認：");
    if (typed !== "完成") { showStatus("確認字串不符，已取消", true); return; }
  }

  const { error } = await sb.from("task")
    .update({ status: next, updated_at: new Date().toISOString(), updated_by: me.email })
    .eq("id", task.id);
  if (error) { showStatus("儲存失敗：" + error.message, true); return; }

  // 記錄歷史
  await sb.from("task_log").insert({
    task_id: task.id, field: "status", value: next, created_by: me.email
  });

  task.status = next;
  // 同步更新 tasksByCell
  const k = tlmContext.entityId + "|" + tlmContext.date;
  if (tasksByCell[k]) {
    const i = tasksByCell[k].findIndex(x => x.id === task.id);
    if (i >= 0) tasksByCell[k][i].status = next;
  }
  renderTaskList();
  // 同步更新主畫面格子摘要
  if (currentTab === "task") repaintTaskCell(tlmContext.entityId, tlmContext.date);
  showStatus("已更新為「" + next + "」");
}

document.getElementById("tlm-add-btn").onclick = async () => {
  if (!tlmContext || !tlmContext.canEdit) return;
  const content = document.getElementById("tlm-new-content").value.trim();

    content: content,
    status: "待辦",
    created_by: me.email,
    updated_by: me.email
  }).select().single();

};

/* 重畫單一任務格子（摘要） */
function repaintTaskCell(entityId, date){
  const td = document.querySelector(
    "td.task-cell[data-entity='" + entityId + "'][data-date='" + date + "']");
  if (!td) return;
  // 用 outerHTML 替換
  const isMine = entityId === me.id;
  const canEdit = isMine || me.role === "admin";
  const wd = new Date(date).getDay();
  const isWeekend = (wd === 0 || wd === 6);
  const today = new Date();
  const todayStr = (today.getFullYear() === viewYear && today.getMonth() + 1 === viewMonth)
    ? dateStr(viewYear, viewMonth, today.getDate()) : null;
  const isToday = date === todayStr;
  td.outerHTML = taskCellHtml(entityId, date, canEdit, isToday);
  // 重綁事件
  const newTd = document.querySelector(
    "td.task-cell[data-entity='" + entityId + "'][data-date='" + date + "']");
  if (newTd && newTd.dataset.edit === "1") {
    newTd.onclick = () => onTaskCellClick(newTd);
  }
}

/* 「指派給全部人」按鈕 */
document.getElementById("bam-all-btn").onclick = () => {
  bamMode = "all-range";
  document.getElementById("bam-target-info").textContent =
    "全部 " + roster.length + " 人（在職）";
  showStatus("已切換為「指派給全部人」");
};

document.getElementById("bam-cancel").onclick = () => {
  document.getElementById("batch-assign-modal").style.display = "none";
  bamMode = null; bamSelectionKeys = null;
};

document.getElementById("bam-save").onclick = async () => {
  const content = document.getElementById("bam-content").value.trim();
  const fromDate = document.getElementById("bam-from").value;
  const toDate = document.getElementById("bam-to").value;
  if (!content) { showStatus("請填任務內容", true); return; }
  if (!fromDate || !toDate || fromDate > toDate) {
    showStatus("日期範圍不正確", true); return;
  }

  // 算出要指派的 (entity, date) 清單
  const targets = [];
  let entityIds = [];
  if (bamMode === "all-range") {
    entityIds = roster.map(p => p.id);
  } else {
    entityIds = Array.from(new Set(bamSelectionKeys.map(k => k.split("|")[0])));
  }
  // 日期列表
  const dates = [];
  const d1 = new Date(fromDate), d2 = new Date(toDate);
  for (let d = new Date(d1); d <= d2; d.setDate(d.getDate() + 1)) {
    dates.push(d.toISOString().slice(0, 10));
  }
  for (const eid of entityIds) {
    for (const ds of dates) {
      targets.push({
        entity_id: eid, work_date: ds, content,
        status: "待辦", created_by: me.email, updated_by: me.email
      });
    }
  }

  if (targets.length === 0) { showStatus("沒有可指派的對象", true); return; }
  if (targets.length > 500 &&
      !confirm("即將新增 " + targets.length + " 筆任務，確定嗎？")) return;

  const { data, error } = await sb.from("task").insert(targets).select();
  if (error) { showStatus("指派失敗：" + error.message, true); return; }

  // 更新本地
  for (const t of (data || [])) {
    const k = t.entity_id + "|" + t.work_date;
    if (!tasksByCell[k]) tasksByCell[k] = [];
    tasksByCell[k].push(t);
  }

  document.getElementById("batch-assign-modal").style.display = "none";
  bamMode = null; bamSelectionKeys = null;
  clearTaskSelection();
  if (taskSelectMode) setTaskSelectMode(false);
  updateTaskSelCount();
  if (currentTab === "task") renderTable();
  showStatus("已指派 " + targets.length + " 筆任務");
};

/* ============ 我的面板 ============ */
async function renderMyPanel(){
  const view = document.getElementById("mine-view");
  view.innerHTML = "<div class='loading'>載入中…</div>";

  // 從資料庫查「我所有未完成的任務」（不限月份；排除已撤銷）
  const { data, error } = await sb.from("task")
    .select("id,work_date,content,status,created_at")
    .eq("entity_id", me.id)
    .not("status", "in", "(完成,已撤銷)")
    .order("work_date", { ascending: true });

  if (error) {
    view.innerHTML = "<div class='loading'>載入失敗：" + error.message + "</div>";
    return;
  }
  myOpenTasks = data || [];

  // 同時查「最近 7 天內完成的」做為「最近已完成」區
  const recent = new Date();
  recent.setDate(recent.getDate() - 7);
  const recentStr = recent.toISOString().slice(0, 10);
  const doneRes = await sb.from("task")
    .select("id,work_date,content,status")
    .eq("entity_id", me.id)
    .eq("status", "完成")
    .gte("work_date", recentStr)
    .order("work_date", { ascending: false });
  const recentDone = doneRes.data || [];

  // 分組：過期、今天、未來
  const todayStr = new Date().toISOString().slice(0, 10);
  const overdue = myOpenTasks.filter(t => t.work_date < todayStr);
  const today_ = myOpenTasks.filter(t => t.work_date === todayStr);
  const future = myOpenTasks.filter(t => t.work_date > todayStr);

  let html = "<div class='mine-section'>";
  html += "<h2>👤 " + escapeHtml(me.name) + " 的待辦</h2>";

  if (myOpenTasks.length === 0 && recentDone.length === 0) {
    html += "<div class='mine-empty'>目前沒有任務 🎉</div>";
  } else {
    if (overdue.length > 0) {
      html += "<h2 style='color:#c0392b'>⚠ 已過期未完成（" + overdue.length + "）</h2>";
      html += overdue.map(taskRowHtml).join("");
    }
    if (today_.length > 0) {
      html += "<h2>📌 今天（" + today_.length + "）</h2>";
      html += today_.map(taskRowHtml).join("");
    }
    if (future.length > 0) {
      html += "<h2>📅 未來（" + future.length + "）</h2>";
      html += future.map(taskRowHtml).join("");
    }
    if (overdue.length + today_.length + future.length === 0) {
      html += "<div class='mine-empty'>沒有未完成的任務 🎉</div>";
    }
    if (recentDone.length > 0) {
      html += "<h2 style='color:#6f9c5b'>✓ 最近完成</h2>";
      html += recentDone.slice(0, 10).map(taskRowHtml).join("");
    }
  }
  html += "</div>";
  view.innerHTML = html;

  // 綁定點擊動作
  view.querySelectorAll(".mine-task .t-act-btn").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.id;
      const next = btn.dataset.next;
      cycleMyTask(id, next);
    };
  });
}

function taskRowHtml(t){
  const stt = taskStatusMap[t.status] || { color: "#e6e3d4", label: t.status };
  const isDone = t.status === "完成";
  // 算下一個狀態（排除「已撤銷」）
  const codes = taskStatuses.map(s => s.code).filter(c => c !== "已撤銷");
  const idx = codes.indexOf(t.status);
  const next = codes[(idx + 1) % codes.length];
  return `
    <div class="mine-task${isDone ? ' done' : ''}">
      <div class="t-main">
        <div class="t-date">${t.work_date}</div>
        <div class="t-text">${escapeHtml(t.content)}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
        <span class="t-status-tag" style="background:${stt.color};color:${textColorFor(stt.color)}">${stt.label}</span>
        ${isDone ? '' :
          `<button class="t-act-btn" data-id="${t.id}" data-next="${next}">→ ${next}</button>`}
      </div>
    </div>
  `;
}

async function cycleMyTask(id, next){
  // 改為「完成」要打字確認
  if (next === "完成") {
    const typed = prompt("改為「完成」請輸入「完成」二字確認：");
    if (typed !== "完成") { showStatus("確認字串不符，已取消", true); return; }
  }
  const { error } = await sb.from("task")
    .update({ status: next, updated_at: new Date().toISOString(), updated_by: me.email })
    .eq("id", id);
  if (error) { showStatus("儲存失敗：" + error.message, true); return; }
  await sb.from("task_log").insert({
    task_id: id, field: "status", value: next, created_by: me.email
  });
  showStatus("已更新為「" + next + "」");
  renderMyPanel();
}

    const labelI = div.querySelector(".ss-label");
    const colorI = div.querySelector("input[type=color]");
    const orderI = div.querySelector("input[type=number]");
    const toggleB = div.querySelector(".ss-toggle");

    const save = async (patch) => {
      const { error } = await sb.from("shift_type")
        .update(patch).eq("code", row.code);
      if (error) showStatus("儲存失敗：" + error.message, true);
      else { showStatus("已儲存"); Object.assign(row, patch); }
    };
    labelI.onchange = () => save({ label: labelI.value });
    colorI.onchange = () => save({ color: colorI.value });
    orderI.onchange = () => save({ sort_order: parseInt(orderI.value) || 0 });
    toggleB.onclick = async () => {
      await save({ active: !row.active });
      div.classList.toggle("inactive");
      toggleB.textContent = row.active ? "停用" : "啟用";
    };

    box.appendChild(div);
  }
}

document.getElementById("ss-add-btn").onclick = async () => {
  const code = document.getElementById("ss-new-code").value.trim();
  const label = document.getElementById("ss-new-label").value.trim();
  const color = document.getElementById("ss-new-color").value;
  if (!code || !label) { showStatus("請填代碼和名稱", true); return; }
  const { error } = await sb.from("shift_type").insert({
    code, label, color, sort_order: 99, active: true
  });
  if (error) { showStatus("新增失敗：" + error.message, true); return; }
  showStatus("已新增：" + label);
  document.getElementById("ss-new-code").value = "";
  document.getElementById("ss-new-label").value = "";
  // 重畫列表
  openShiftSettings();
};

/* =================== 人員排序設定(僅 admin) =================== */
document.getElementById("roster-order-btn").onclick = openRosterOrder;
document.getElementById("ro-close").onclick = () => {
  document.getElementById("roster-order-modal").style.display = "none";
  // 關閉時重新讀 roster、刷新主畫面
  reloadRosterAndRefresh();
};

async function openRosterOrder(){
  // 拉所有在職人員(含當前的 display_order)
  const { data, error } = await sb.from("roster")
    .select("id,badge_no,name,display_order")
    .eq("active", true)
    .order("display_order", { ascending: true, nullsFirst: false })
    .order("badge_no");
  if (error) { showStatus("讀取失敗:" + error.message, true); return; }
  renderRosterOrderList(data || []);
  document.getElementById("roster-order-modal").style.display = "flex";
}

function renderRosterOrderList(rows){
  const box = document.getElementById("ro-list");
  box.innerHTML = "";
  for (const row of rows) {
    const div = document.createElement("div");
    div.className = "ro-row";
    div.innerHTML = `
      <input class="ro-order" type="number" step="0.5" value="${row.display_order ?? row.badge_no}">
      <div class="ro-name">${escapeHtml(row.name)}</div>
      <span class="ro-badge">番號 ${row.badge_no}</span>
    `;
    const input = div.querySelector(".ro-order");
    input.onchange = async () => {
      const v = parseFloat(input.value);
      if (isNaN(v)) { showStatus("請填數字", true); input.value = row.display_order ?? row.badge_no; return; }
      const { error } = await sb.from("roster")
        .update({ display_order: v }).eq("id", row.id);
      if (error) { showStatus("儲存失敗:" + error.message, true); return; }
      row.display_order = v;
      showStatus("已儲存:" + row.name + " → " + v);
    };
    box.appendChild(div);
  }
}

/* 重新編號:把目前順序整理成 1, 2, 3... 整數 */
document.getElementById("ro-renumber").onclick = async () => {
  if (!confirm("把目前的順序重新整理成 1, 2, 3...?\n(只整理數字,實際順序不會改變。整理後留出間隔方便日後插隊。)")) return;
  const { data, error } = await sb.from("roster")
    .select("id,badge_no,display_order")
    .eq("active", true)
    .order("display_order", { ascending: true, nullsFirst: false })
    .order("badge_no");
  if (error) { showStatus("讀取失敗:" + error.message, true); return; }

  // 用整數間隔 10 重新編號(1, 11, 21... 之類,方便插隊)
  // 改用 10, 20, 30... 更直觀
  const updates = (data || []).map((row, i) => ({
    id: row.id, display_order: (i + 1) * 10
  }));
  let okCount = 0;
  for (const u of updates) {
    const { error: e } = await sb.from("roster")
      .update({ display_order: u.display_order }).eq("id", u.id);
    if (!e) okCount++;
  }
  showStatus("已重新編號 " + okCount + " 人");
  openRosterOrder();  // 重畫列表
};

/* 關閉排序設定後,重新載入主畫面 */
async function reloadRosterAndRefresh(){
  const r = await sb.from("roster").select("id,badge_no,name,display_order")
    .eq("active", true)
    .order("display_order", { ascending: true, nullsFirst: false })
    .order("badge_no");
  roster = r.data || [];
  // 主畫面重畫
  if (currentTab === "shift" || currentTab === "task") renderTable();
}
</script>
